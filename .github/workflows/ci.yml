name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m "not slow and not e2e_llm"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-types:
    needs: backend
    if: hashFiles('frontend/packages/api-types/src/schema.d.ts') != ''
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docu
          POSTGRES_PASSWORD: docu
          POSTGRES_DB: docu
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - name: start api
        working-directory: backend
        env:
          AGENT_FAKE_MODEL: "1"
          SECRET_KEY: test-secret-key-32-bytes-minimum!!
          DATABASE_URL: postgresql+asyncpg://docu:docu@localhost:5432/docu
          REDIS_URL: redis://localhost:6379/0
        run: uv run uvicorn docu.api.app:create_app --factory --port 8000 &
      - run: pnpm gen:api
      - run: git diff --exit-code frontend/packages/api-types
        working-directory: .

  e2e:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docu
          POSTGRES_PASSWORD: docu
          POSTGRES_DB: docu
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/apps/web
      - name: start api
        working-directory: backend
        env:
          AGENT_FAKE_MODEL: "1"
          SECRET_KEY: test-secret-key-32-bytes-minimum!!
          DATABASE_URL: postgresql+asyncpg://docu:docu@localhost:5432/docu
          REDIS_URL: redis://localhost:6379/0
        run: uv run uvicorn docu.api.app:create_app --factory --port 8000 &
      - name: start worker
        working-directory: backend
        env:
          AGENT_FAKE_MODEL: "1"
          SECRET_KEY: test-secret-key-32-bytes-minimum!!
          DATABASE_URL: postgresql+asyncpg://docu:docu@localhost:5432/docu
          REDIS_URL: redis://localhost:6379/0
        run: uv run celery -A docu.worker.celery_app worker -Q turns,files,exports,default -l warning &
      - name: smoke
        env:
          PLAYWRIGHT_PORT: "5173"
          AGENT_FAKE_MODEL: "1"
        run: pnpm test:e2e -- --project=en-desktop --project=ar-desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/apps/web/playwright-report

  arabic-placeholders:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fail if Arabic placeholders remain
        run: |
          if grep -R "__TODO_AR__" frontend/apps/web/src/i18n/ar.json; then
            echo "Arabic placeholders remain"
            exit 1
          fi
