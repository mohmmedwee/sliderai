[project]
name = "docu"
version = "0.1.0"
description = "Docu Builder: bilingual document, slide, and page editor with an agent."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "boto3>=1.43.114",
    "celery[redis]>=5.6.3",
    "clamd>=1.0.2",
    "cryptography>=50.0.2",
    "ddgs>=9.16.0",
    "defusedxml>=0.7.1",
    "email-validator>=2.3.0",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.11",
    "lxml>=6.1.3",
    "markitdown[docx,pptx,xlsx]>=0.1.8",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-celery>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pymupdf>=2.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "redis>=6.4.0",
    "sentry-sdk[celery,fastapi]>=2.72.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "sse-starlette>=3.5.0",
    "stripe>=16.0.0",
    "structlog>=26.1.0",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "schemathesis>=4.32.1",
    "testcontainers[postgres,redis]>=4.13.3",
    "types-redis>=4.6.0.20241004",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docu"]
