# Local stack for Docu Builder.
# Host ports are overridable so this stack can run beside other projects.
# Defaults are the card ports. infra/.env (gitignored) sets the local overrides:
#   DOCU_DB_PORT=5442 DOCU_REDIS_PORT=6389
# Matching env (see backend/.env.example). With the local overrides:
#   DATABASE_URL=postgresql+asyncpg://docu:docu@localhost:5442/docu
#   REDIS_URL=redis://localhost:6389/0
#   S3 endpoint http://localhost:9000 (bucket docu, keys minio / minio12345)
# Also overridable: DOCU_MINIO_PORT (9000), DOCU_MINIO_CONSOLE_PORT (9001),
# DOCU_MAILPIT_SMTP_PORT (1025), DOCU_MAILPIT_UI_PORT (8025), DOCU_CLAMAV_PORT (3310).
# ClamAV downloads signatures on first start and can take several minutes
# before its healthcheck passes. The other services should be healthy within 2 minutes.

name: docu

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docu
      POSTGRES_PASSWORD: docu
      POSTGRES_DB: docu
    ports:
      - "${DOCU_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docu -d docu"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${DOCU_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # minio/minio left Docker Hub in September 2026 and Quay now requires a login.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "${DOCU_MINIO_PORT:-9000}:9000"
      - "${DOCU_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  minio-init:
    # minio/mc left Docker Hub; this mirror still has a shell for the bootstrap.
    image: netiedge/minio-mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 2; done &&
      mc mb --ignore-existing local/docu
      "

  mailpit:
    image: axllent/mailpit
    ports:
      - "${DOCU_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${DOCU_MAILPIT_UI_PORT:-8025}:8025"

  clamav:
    # The official tag is amd64-only. Apple Silicon runs it under emulation.
    image: clamav/clamav:stable
    platform: linux/amd64
    ports:
      - "${DOCU_CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  pgdata:
  miniodata:
